<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audio preview — Bells of the Unlived</title>
    <style>
      :root { color-scheme: dark; --bg: #100d0a; --panel: #1b1612; --line: #3a2f25; --bronze: #b8925a; --text: #e8dcc8; --dim: #9c8c76; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
      header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      h1 { font-size: 16px; margin: 0 12px 0 0; color: var(--bronze); font-weight: 600; letter-spacing: 0.04em; }
      main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; padding: 12px 16px; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0 0 8px; }
      h3 { font-size: 11px; color: var(--dim); margin: 8px 0 4px; font-weight: 500; }
      button { background: #2a221b; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; margin: 2px; cursor: pointer; font: inherit; }
      button:hover { border-color: var(--bronze); }
      button.on { background: var(--bronze); color: #1a140e; }
      button.cap { border-left: 3px solid var(--bronze); }
      label { display: inline-flex; align-items: center; gap: 4px; margin: 2px 8px 2px 0; color: var(--dim); }
      input[type=range] { width: 110px; }
      #log { height: 180px; overflow: auto; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }
      #levels { font-family: ui-monospace, monospace; font-size: 11px; white-space: pre; overflow: auto; max-height: 520px; }
      #status { color: var(--dim); }
      @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Audio preview</h1>
      <button id="unlock">Unlock audio</button>
      <span id="status">locked</span>
      <label><input type="checkbox" id="muffle" /> menu muffle</label>
      <label><input type="checkbox" id="mono" /> mono</label>
      <label><input type="checkbox" id="hrtf" checked /> HRTF</label>
      <button id="stress">Stress (120 cues)</button>
    </header>
    <main>
      <div>
        <section>
          <h2>Cues <small>(bronze edge = captioned)</small></h2>
          <div>
            <label>surface <select id="surface"><option>stone</option><option>wood</option><option>dirt</option><option>metal</option><option>water</option></select></label>
            <label>rate <input type="range" id="rate" min="0.5" max="2" step="0.01" value="1" /><span id="rateV">1</span></label>
            <label>volume <input type="range" id="vol" min="0" max="2" step="0.01" value="1" /></label>
            <label><input type="checkbox" id="use3d" /> play at source position</label>
          </div>
          <div id="cues"></div>
        </section>
        <section>
          <h2>Loops</h2>
          <div id="loops"></div>
          <h2 style="margin-top:10px">Ambience beds</h2>
          <div id="amb"></div>
          <h2 style="margin-top:10px">Music</h2>
          <div id="music"></div>
        </section>
      </div>
      <div>
        <section>
          <h2>Listener &amp; source</h2>
          <label>listener yaw <input type="range" id="yaw" min="-180" max="180" step="1" value="0" /><span id="yawV">0°</span></label><br />
          <label>source x <input type="range" id="sx" min="-40" max="40" step="0.5" value="4" /><span id="sxV">4</span></label><br />
          <label>source z <input type="range" id="sz" min="-40" max="40" step="0.5" value="-4" /><span id="szV">-4</span></label><br />
          <label>source y <input type="range" id="sy" min="-5" max="10" step="0.5" value="0" /><span id="syV">0</span></label>
          <p style="color:var(--dim);margin:6px 0 0">Listener at origin; yaw 0 faces −Z. Active voices: <b id="voices">0</b></p>
        </section>
        <section>
          <h2>Volumes</h2>
          <div id="vols"></div>
        </section>
        <section>
          <h2>Captions</h2>
          <div id="log"></div>
        </section>
        <section>
          <h2>Offline level check</h2>
          <button id="lvl">Render all cues</button>
          <button id="lvlMusic">Render music (30 s each)</button>
          <button id="lvlLoops">Render loops</button>
          <div id="levels"></div>
        </section>
      </div>
    </main>
    <script type="module" src="./audio.ts"></script>
  </body>
</html>
